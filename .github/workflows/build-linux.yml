name: Build Linux

# Built on Ubuntu 24.04 (glibc 2.39) so the binary also runs on SteamOS,
# Bazzite, Fedora, Debian 13 and other current distros.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache wget \
            libgtk-3-dev libx11-xcb-dev libvulkan-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libcurl4-openssl-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          ccache --set-config=max_size=5G
          cmake --preset linux-amd64-release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-amd64-release --parallel 3

      - name: Package
        run: |
          out=out/build/linux-amd64-release
          pkg=package/espgaluda2-recomp-linux-amd64
          mkdir -p $pkg/game_data
          cp -L $out/espgaluda2_recomp $out/*.so $pkg/
          cp packaging/espgaluda2-recomp.sh packaging/README.txt LICENSE $pkg/
          chmod +x $pkg/espgaluda2-recomp.sh
          curl -sSfL -o $pkg/gamecontrollerdb.txt \
            https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt
          tar -C package -czf espgaluda2-recomp-linux-amd64.tar.gz espgaluda2-recomp-linux-amd64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: espgaluda2-recomp-linux-amd64
          path: espgaluda2-recomp-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" espgaluda2-recomp-linux-amd64.tar.gz --clobber
