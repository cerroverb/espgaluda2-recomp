name: Build Linux

# Built on Ubuntu 24.04 (glibc 2.39) so the binary also runs on SteamOS,
# Bazzite, Fedora, Debian 13 and other current distros.
# A build check only: the runner has no DirectXShaderCompiler, so the renderer's host shaders come from
# prebuilt/host_shaders and the game's translated shader cache from the ESPGALUDA2_SHADER_CACHE secret, as in the
# AArch64 workflow. Releases are built and tested before they are published; this artifact is not one.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache wget zstd python3 \
            libgtk-3-dev libx11-xcb-dev libvulkan-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libcurl4-openssl-dev
          # SDL3 (sdk-patches/0006): its Linux build dependencies, as SDL's docs/README-linux.md lists them for
          # Ubuntu 22.04+.
          sudo apt-get install -y libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libthai-dev libwayland-dev libdecor-0-dev liburing-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Unpack the prebuilt shaders
        env:
          SHADER_CACHE: ${{ secrets.ESPGALUDA2_SHADER_CACHE }}
        run: |
          mkdir -p "$RUNNER_TEMP/gpu_prebuilt"
          cp -r prebuilt/host_shaders "$RUNNER_TEMP/gpu_prebuilt/"
          printf '%s' "$SHADER_CACHE" | base64 -d | zstd -d -o "$RUNNER_TEMP/gpu_prebuilt/shader_cache.cpp"
          grep -c "0x" "$RUNNER_TEMP/gpu_prebuilt/shader_cache.cpp"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          ccache --set-config=max_size=5G
          cmake --preset linux-amd64-release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DESPGALUDA2_PREBUILT_GPU_DIR=$RUNNER_TEMP/gpu_prebuilt"

      - name: Build
        run: cmake --build --preset linux-amd64-release --parallel 3

      - name: Package
        run: |
          out=out/build/linux-amd64-release
          pkg=package/espgaluda2-recomp-linux-amd64
          mkdir -p $pkg/game_data
          cp -L $out/espgaluda2_recomp $out/*.so $pkg/
          cp -r $out/tools $pkg/
          cp -r $out/translation $pkg/
          cp packaging/README.txt LICENSE LICENSE-GPL-3.0 $pkg/
          curl -sSfL -o $pkg/gamecontrollerdb.txt \
            https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt
          tar -C package -czf espgaluda2-recomp-linux-amd64.tar.gz espgaluda2-recomp-linux-amd64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: espgaluda2-recomp-linux-amd64
          path: espgaluda2-recomp-linux-amd64.tar.gz
          if-no-files-found: error
