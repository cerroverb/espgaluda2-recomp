name: Build Linux AArch64

# The Linux AArch64 release build, on GitHub's ARM runner (Ubuntu 24.04, glibc 2.39). That runner has no
# DirectXShaderCompiler, so the game's translated shaders and the host shaders come prebuilt from an x86-64 build
# (SPIR-V, the same on every CPU): the renderer's own host shaders from prebuilt/host_shaders, and the game's translated
# shaders from the ESPGALUDA2_SHADER_CACHE secret (base64 zstd of that build's renut_gpu/shader_cache.cpp; game-derived,
# so kept out of the public tree; they ship inside the executable as on x86-64). ESPGALUDA2_PREBUILT_GPU_DIR makes the
# build use them (src/renut_engine/gpu/gpu.cmake).

on:
  workflow_dispatch:
  push:
    branches:
      - ci/arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache wget zstd python3 \
            libgtk-3-dev libx11-xcb-dev libvulkan-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libcurl4-openssl-dev
          # SDL3 (sdk-patches/0006): its Linux build dependencies, as SDL's docs/README-linux.md lists them for
          # Ubuntu 22.04+.
          sudo apt-get install -y libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libthai-dev libwayland-dev libdecor-0-dev liburing-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Unpack the prebuilt shaders
        env:
          SHADER_CACHE: ${{ secrets.ESPGALUDA2_SHADER_CACHE }}
        run: |
          mkdir -p "$RUNNER_TEMP/gpu_prebuilt"
          cp -r prebuilt/host_shaders "$RUNNER_TEMP/gpu_prebuilt/"
          printf '%s' "$SHADER_CACHE" | base64 -d | zstd -d -o "$RUNNER_TEMP/gpu_prebuilt/shader_cache.cpp"
          grep -c "0x" "$RUNNER_TEMP/gpu_prebuilt/shader_cache.cpp"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-arm64-${{ github.sha }}
          restore-keys: ccache-linux-arm64-

      - name: Configure
        run: |
          ccache --set-config=max_size=5G
          cmake --preset linux-arm64-release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DESPGALUDA2_PREBUILT_GPU_DIR=$RUNNER_TEMP/gpu_prebuilt"

      - name: Build
        run: cmake --build --preset linux-arm64-release --parallel 3

      - name: Package
        run: |
          out=out/build/linux-arm64-release
          pkg=package/espgaluda2-recomp
          mkdir -p $pkg/game_data $pkg/tools/extract-xiso
          cp -L $out/espgaluda2_recomp $out/*.so $pkg/
          cp $out/tools/extract-xiso/extract-xiso $pkg/tools/extract-xiso/
          cp $out/tools/extract-xiso/LICENSE.TXT $pkg/tools/extract-xiso/
          cp packaging/espgaluda2-recomp.sh packaging/README.txt LICENSE LICENSE-GPL-3.0 $pkg/
          chmod +x $pkg/espgaluda2-recomp.sh
          file $pkg/espgaluda2_recomp
          ! strings $pkg/espgaluda2_recomp $pkg/*.so | grep -q "/home/runner"
          tar --owner=0 --group=0 -C package -czf espgaluda2-recomp-linux-arm64.tar.gz espgaluda2-recomp

      - name: Start check (no GPU on the runner)
        run: |
          cd package/espgaluda2-recomp
          timeout 20 ./espgaluda2_recomp --help > start.log 2>&1 || true
          head -20 start.log

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: espgaluda2-recomp-linux-arm64
          path: espgaluda2-recomp-linux-arm64.tar.gz
          if-no-files-found: error
